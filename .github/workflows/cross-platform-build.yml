name: Cross-platform build

on:
  push:
    branches:
      - main
      - 'ci-validation/**'

permissions:
  contents: read

jobs:
  linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenGL and GLUT development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel

  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -A x64 -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel

  macos_arm64:
    name: Build (macOS ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel

  macos_intel:
    name: Build (macOS Intel)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
